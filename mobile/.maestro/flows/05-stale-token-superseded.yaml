appId: vn.gov.pc02.mobile
name: "05 — Admin re-reset supersedes the pending password token (Codex C7)"
tags:
  - auth
  - first-login
  - critical
env:
  TEST_EMAIL: e2e+stale409@test.pc02.local
  TEMP_PASSWORD_V1: TempPass1!
  TEMP_PASSWORD_V2: TempPass2!
  NEW_PASSWORD: NewStr0ngPw!
---
# Seed user with mustChangePassword=true and the FIRST temp password.
- runScript:
    file: ../scripts/seed-user.js
    env:
      FIXTURE_API_BASE_URL: ${MAESTRO_FIXTURE_API_BASE_URL}
      FIXTURE_TOKEN: ${MAESTRO_TEST_SEED_TOKEN}
      FIXTURE_EMAIL: ${TEST_EMAIL}
      FIXTURE_PASSWORD: ${TEMP_PASSWORD_V1}
      FIXTURE_MUST_CHANGE_PASSWORD: 'true'
      FIXTURE_TWO_FA_ENABLED: 'false'
      FIXTURE_BUMP_TOKEN_VERSION: 'false'
      FIXTURE_REQUIRE_OTP: 'false'

- launchApp:
    appId: vn.gov.pc02.mobile
    clearState: true
    clearKeychain: true

# Login with temp v1 → mobile lands on first-login screen and holds a
# changePasswordToken bound to current tokenVersion.
- tapOn:
    id: "login-email-field"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-field"
- inputText: ${TEMP_PASSWORD_V1}
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- extendedWaitUntil:
    visible:
      id: "first-login-instruction-banner"
    timeout: 10000

# SIMULATE ADMIN ACTION: re-seed user with new temp pw AND bump tokenVersion.
# This invalidates the changePasswordToken mobile is currently holding.
- runScript:
    file: ../scripts/seed-user.js
    env:
      FIXTURE_API_BASE_URL: ${MAESTRO_FIXTURE_API_BASE_URL}
      FIXTURE_TOKEN: ${MAESTRO_TEST_SEED_TOKEN}
      FIXTURE_EMAIL: ${TEST_EMAIL}
      FIXTURE_PASSWORD: ${TEMP_PASSWORD_V2}
      FIXTURE_MUST_CHANGE_PASSWORD: 'true'
      FIXTURE_TWO_FA_ENABLED: 'false'
      FIXTURE_BUMP_TOKEN_VERSION: 'true'
      FIXTURE_REQUIRE_OTP: 'false'

# User (oblivious) tries to submit the form. The guard rejects the superseded
# token with 401 before the password-change service can run.
# Mobile MUST: show toast, clear pending state, route back to /login.
- tapOn:
    id: "first-login-new-password-field"
- inputText: ${NEW_PASSWORD}
- hideKeyboard
- tapOn:
    id: "first-login-confirm-password-field"
- inputText: ${NEW_PASSWORD}
- hideKeyboard
- tapOn:
    id: "first-login-submit-button"

# Assertion: we're back on login screen, not stuck on first-login or dashboard.
- extendedWaitUntil:
    visible:
      id: "login-email-field"
    timeout: 10000
- assertNotVisible:
    id: "first-login-instruction-banner"
- assertNotVisible:
    id: "dashboard-scaffold"

# Anh logs in with the NEW temp pw → first-login screen again.
- tapOn:
    id: "login-email-field"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-field"
- inputText: ${TEMP_PASSWORD_V2}
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- extendedWaitUntil:
    visible:
      id: "first-login-instruction-banner"
    timeout: 10000

# This time submit succeeds.
- tapOn:
    id: "first-login-new-password-field"
- inputText: ${NEW_PASSWORD}
- hideKeyboard
- tapOn:
    id: "first-login-confirm-password-field"
- inputText: ${NEW_PASSWORD}
- hideKeyboard
- tapOn:
    id: "first-login-submit-button"
- extendedWaitUntil:
    visible:
      id: "dashboard-scaffold"
    timeout: 15000
