appId: vn.gov.pc02.mobile
name: "02 — Login with 2FA TOTP code"
tags:
  - auth
  - 2fa
env:
  TEST_EMAIL: e2e+twofa@test.pc02.local
  TEST_PASSWORD: Test1234!Aa
---
# Seed a user with 2FA enabled. Backend returns the current TOTP code so
# Maestro can submit it without needing to compute TOTP client-side.
- runScript:
    file: ../scripts/seed-user.js
    env:
      FIXTURE_API_BASE_URL: ${MAESTRO_FIXTURE_API_BASE_URL}
      FIXTURE_TOKEN: ${MAESTRO_TEST_SEED_TOKEN}
      FIXTURE_EMAIL: ${TEST_EMAIL}
      FIXTURE_PASSWORD: ${TEST_PASSWORD}
      FIXTURE_MUST_CHANGE_PASSWORD: 'false'
      FIXTURE_TWO_FA_ENABLED: 'true'
      FIXTURE_BUMP_TOKEN_VERSION: 'false'
      FIXTURE_REQUIRE_OTP: 'true'

- launchApp:
    appId: vn.gov.pc02.mobile
    clearState: true
    clearKeychain: true

# Phase A: Submit credentials → backend should return pending: true + twoFaToken.
- tapOn:
    id: "login-email-field"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-field"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit-button"

# Phase B: 2FA screen auto-submits when the sixth digit is entered.
- extendedWaitUntil:
    visible:
      id: "2fa-otp-field"
    timeout: 10000
# Slow emulator text entry may cross the TOTP window. Refresh the test-only
# user code now; bumpTokenVersion=false keeps the pending challenge valid.
- runScript:
    file: ../scripts/seed-user.js
    env:
      FIXTURE_API_BASE_URL: ${MAESTRO_FIXTURE_API_BASE_URL}
      FIXTURE_TOKEN: ${MAESTRO_TEST_SEED_TOKEN}
      FIXTURE_EMAIL: ${TEST_EMAIL}
      FIXTURE_PASSWORD: ${TEST_PASSWORD}
      FIXTURE_MUST_CHANGE_PASSWORD: 'false'
      FIXTURE_TWO_FA_ENABLED: 'true'
      FIXTURE_BUMP_TOKEN_VERSION: 'false'
      FIXTURE_REQUIRE_OTP: 'true'
- tapOn:
    id: "2fa-otp-field"
- inputText: ${output.otp}

# Phase C: After OTP verify, we should reach the dashboard.
- extendedWaitUntil:
    visible:
      id: "dashboard-scaffold"
    timeout: 15000
