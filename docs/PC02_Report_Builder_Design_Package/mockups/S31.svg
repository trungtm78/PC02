<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960"><title>S31 Ngừng phát sinh và thu hồi grant</title><rect x="0" y="0" width="1440" height="960" rx="0" fill="#F3F6FA"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="white"/><rect x="0" y="64" width="216" height="896" rx="0" fill="#083C70"/><rect x="20" y="15" width="34" height="34" rx="6" fill="#B68A1F"/><text x="27" y="39" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="white" font-weight="700">PC</text><text x="68" y="30" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#083C70" font-weight="700">HỆ THỐNG PC02</text><text x="68" y="48" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" fill="#63758A" font-weight="400">Quản lý báo cáo</text><text x="1150" y="28" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#1B2D40" font-weight="700">Tài khoản minh họa</text><text x="1150" y="48" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" fill="#63758A" font-weight="400">Báo cáo động</text><text x="22" y="108" font-family="Arial,DejaVu Sans,sans-serif" font-size="11" fill="#ABC6DF" font-weight="400">TÌM KIẾM MENU</text><text x="22" y="157" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="white" font-weight="400">Tổng quan</text><text x="22" y="202" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="white" font-weight="400">Nghiệp vụ chính</text><text x="22" y="264" font-family="Arial,DejaVu Sans,sans-serif" font-size="11" fill="#F4CF76" font-weight="700">BÁO CÁO VÀ THỐNG KÊ</text><rect x="10" y="287" width="196" height="43" rx="6" fill="#155C98"/><text x="24" y="315" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="white" font-weight="700">Thiết lập báo cáo</text><text x="24" y="367" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="white" font-weight="400">Nhập và tổng hợp</text><text x="24" y="419" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="white" font-weight="400">Tình trạng nhập liệu</text><text x="24" y="487" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#C8DBEA" font-weight="400">Báo cáo tháng</text><text x="24" y="532" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#C8DBEA" font-weight="400">Báo cáo quý</text><text x="24" y="577" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#C8DBEA" font-weight="400">Hệ thống</text><text x="24" y="622" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#C8DBEA" font-weight="400">Quản trị</text><text x="20" y="917" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" fill="#C8DBEA" font-weight="400">Mockup đề xuất v1.0</text><text x="20" y="940" font-family="Arial,DejaVu Sans,sans-serif" font-size="11" fill="#C8DBEA" font-weight="400">Dữ liệu minh họa</text><text x="244" y="96" font-family="Arial,DejaVu Sans,sans-serif" font-size="11" fill="#63758A" font-weight="700">BÁO CÁO ĐỘNG  /  S31</text><text x="244" y="139" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#1B2D40" font-weight="700">Xác nhận thay đổi hiệu lực</text><text x="244" y="166" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#63758A" font-weight="400">Ngừng phát sinh kỳ và thu hồi mở lại là hai thao tác khác nhau.</text><rect x="260" y="247" width="549" height="534" rx="12" fill="white" stroke="#D8E2EC"/><text x="284" y="296" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#1B2D40" font-weight="700">Ngừng phát sinh kỳ mới</text><text x="284" y="353" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" fill="#1B2D40" font-weight="400">Các kỳ đã phát sinh và dữ liệu hiện có vẫn giữ</text><text x="284" y="376" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" fill="#1B2D40" font-weight="400">nguyên. Kỳ đang mở tiếp tục theo hạn đã cấu hình.</text><text x="284" y="490" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#63758A" font-weight="700">Lý do bắt buộc</text><rect x="284" y="502" width="501" height="44" rx="6" fill="white" stroke="#D8E2EC"/><text x="296" y="530" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="#1B2D40" font-weight="400">Nhập lý do thao tác</text><rect x="284" y="690" width="100" height="38" rx="6" fill="white" stroke="#D8E2EC"/><text x="298" y="715" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#1B2D40" font-weight="700">Hủy</text><rect x="542" y="690" width="240" height="38" rx="6" fill="#1468B3" stroke="#1468B3"/><text x="556" y="715" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="white" font-weight="700">Ngừng phát sinh</text><rect x="841" y="247" width="549" height="534" rx="12" fill="white" stroke="#D8E2EC"/><text x="865" y="296" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#1B2D40" font-weight="700">Thu hồi quyền mở lại</text><text x="865" y="353" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" fill="#1B2D40" font-weight="400">Chỉ thu hồi grant của Cán bộ A trong kỳ 41. Nếu đã</text><text x="865" y="376" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" fill="#1B2D40" font-weight="400">quá hạn gốc, người này chuyển sang chỉ xem.</text><text x="865" y="490" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#63758A" font-weight="700">Lý do bắt buộc</text><rect x="865" y="502" width="501" height="44" rx="6" fill="white" stroke="#D8E2EC"/><text x="877" y="530" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="#1B2D40" font-weight="400">Nhập lý do thao tác</text><rect x="865" y="690" width="100" height="38" rx="6" fill="white" stroke="#D8E2EC"/><text x="879" y="715" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#1B2D40" font-weight="700">Hủy</text><rect x="1123" y="690" width="240" height="38" rx="6" fill="#1468B3" stroke="#1468B3"/><text x="1137" y="715" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="white" font-weight="700">Thu hồi mở lại</text></svg>