oke="#D8E2EC"/><text x="1146" y="226" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#63758A" font-weight="700">4. Phân công và xác nhận</text><text x="260" y="298" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#63758A" font-weight="700">Mã báo cáo *</text><rect x="260" y="310" width="330" height="44" rx="6" fill="white" stroke="#D8E2EC"/><text x="272" y="338" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="#1B2D40" font-weight="400">BC-TUAN-01</text><text x="614" y="298" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#63758A" font-weight="700">Tên báo cáo *</text><rect x="614" y="310" width="776" height="44" rx="6" fill="white" stroke="#D8E2EC"/><text x="626" y="338" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="#1B2D40" font-weight="400">Báo cáo hoạt động tuần</text><text x="260" y="396" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#63758A" font-weight="700">Mô tả</text><rect x="260" y="408" width="1130" height="44" rx="6" fill="white" stroke="#D8E2EC"/><text x="272" y="436" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="#1B2D40" font-weight="400">Báo cáo hoạt động của cán bộ theo từng tuần</text><rect x="260" y="492" width="1130" height="197" rx="8" fill="#F8FBFF" stroke="#1468B3"/><text x="595" y="543" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#083C70" font-weight="700">Kéo thả file Excel vào đây</text><text x="534" y="575" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#63758A" font-weight="400">Định dạng .xlsx · Tối đa 10 MB theo cấu hình đề xuất</text><rect x="688" y="607" width="160" height="38" rx="6" fill="#1468B3" stroke="#1468B3"/><text x="702" y="632" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="white" font-weight="700">Chọn file</text><text x="260" y="735" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="#1B2D40" font-weight="400">Hướng dẫn: khóa ô tĩnh, mở khóa ô nhập và đặt token như {NUM|#,##0|SUM}.</text><text x="260" y="771" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#1468B3" font-weight="700">Tải file mẫu hướng dẫn   ·   Xem quy ước TEXT NUM DATE TIME</text><rect x="244" y="879" width="1168" height="62" rx="8" fill="white" stroke="#D8E2EC"/><rect x="260" y="891" width="105" height="38" rx="6" fill="white" stroke="#D8E2EC"/><text x="274" y="916" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#1B2D40" font-weight="700">Quay lại</text><text x="385" y="916" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" fill="#63758A" font-weight="400">Thay đổi chỉ áp dụng sau khi xuất bản</text><rect x="1092" y="891" width="138" height="38" rx="6" fill="white" stroke="#D8E2EC"/><text x="1106" y="916" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#1B2D40" font-weight="700">Lưu nháp</text><rect x="1245" y="891" width="150" height="38" rx="6" fill="#1468B3" stroke="#1468B3"/><text x="1259" y="916" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="white" font-weight="700">Tiếp theo</text></svg>