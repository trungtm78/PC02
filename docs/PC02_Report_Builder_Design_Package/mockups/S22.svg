58A" font-weight="400">Kỳ 41 tiếp tục dùng v1. Dữ liệu đã nhập không bị di chuyển hoặc ghi đè.</text><text x="282" y="649" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#63758A" font-weight="700">Áp dụng thay đổi</text><rect x="282" y="661" width="500" height="44" rx="6" fill="white" stroke="#D8E2EC"/><text x="294" y="689" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="#1B2D40" font-weight="400">Từ kỳ chưa mở kế tiếp</text><rect x="260" y="789" width="210" height="38" rx="6" fill="#1468B3" stroke="#1468B3"/><text x="274" y="814" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="white" font-weight="700">Tạo phiên bản mới</text><rect x="490" y="789" width="230" height="38" rx="6" fill="white" stroke="#D8E2EC"/><text x="504" y="814" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#1B2D40" font-weight="700">Ngừng phát sinh kỳ</text><text x="260" y="866" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#63758A" font-weight="400">Sửa phân công kỳ hiện tại cần thao tác riêng, lý do và xác nhận thay đổi mẫu số.</text></svg>