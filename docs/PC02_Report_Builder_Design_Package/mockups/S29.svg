<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960"><title>S29 Xác nhận và kết quả hoàn thành</title><rect x="0" y="0" width="1440" height="960" rx="0" fill="#F3F6FA"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="white"/><rect x="0" y="64" width="216" height="896" rx="0" fill="#083C70"/><rect x="20" y="15" width="34" height="34" rx="6" fill="#B68A1F"/><text x="27" y="39" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="white" font-weight="700">PC</text><text x="68" y="30" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#083C70" font-weight="700">HỆ THỐNG PC02</text><text x="68" y="48" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" fill="#63758A" font-weight="400">Quản lý báo cáo</text><text x="1150" y="28" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#1B2D40" font-weight="700">Tài khoản minh họa</text><text x="1150" y="48" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" fill="#63758A" font-weight="400">Báo cáo động</text><text x="22" y="108" font-family="Arial,DejaVu Sans,sans-serif" font-size="11" fill="#ABC6DF" font-weight="400">TÌM KIẾM MENU</text><text x="22" y="157" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="white" font-weight="400">Tổng quan</text><text x="22" y="202" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="white" font-weight="400">Nghiệp vụ chính</text><text x="22" y="264" font-family="Arial,DejaVu Sans,sans-serif" font-size="11" fill="#F4CF76" font-weight="700">BÁO CÁO VÀ THỐNG KÊ</text><text x="24" y="315" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="white" font-weight="400">Thiết lập báo cáo</text><rect x="10" y="339" width="196" height="43" rx="6" fill="#155C98"/><text x="24" y="367" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="white" font-weight="700">Nhập và tổng hợp</text><text x="24" y="419" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="white" font-weight="400">Tình trạng nhập liệu</text><text x="24" y="487" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#C8DBEA" font-weight="400">Báo cáo tháng</text><text x="24" y="532" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#C8DBEA" font-weight="400">Báo cáo quý</text><text x="24" y="577" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#C8DBEA" font-weight="400">Hệ thống</text><text x="24" y="622" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#C8DBEA" font-weight="400">Quản trị</text><text x="20" y="917" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" fill="#C8DBEA" font-weight="400">Mockup đề xuất v1.0</text><text x="20" y="940" font-family="Arial,DejaVu Sans,sans-serif" font-size="11" fill="#C8DBEA" font-weight="400">Dữ liệu minh họa</text><text x="244" y="96" font-family="Arial,DejaVu Sans,sans-serif" font-size="11" fill="#63758A" font-weight="700">BÁO CÁO ĐỘNG  /  S29</text><text x="244" y="139" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#1B2D40" font-weight="700">Xác nhận hoàn thành báo cáo</text><text x="244" y="166" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#63758A" font-weight="400">Hoàn thành là xác nhận của người nhập, không phải phê duyệt của quản lý.</text><rect x="413" y="235" width="820" height="510" rx="12" fill="white" stroke="#D8E2EC"/><text x="445" y="287" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" fill="#1B2D40" font-weight="700">Hoàn thành kỳ báo cáo này?</text><text x="445" y="331" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#1B2D40" font-weight="400">Báo cáo hoạt động tuần · Kỳ 41/2026</text><rect x="445" y="362" width="325" height="27" rx="13" fill="#E5F5ED"/><text x="456" y="381" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" fill="#127453" font-weight="700">18/18 ô bắt buộc hợp lệ</text><text x="445" y="437" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#1B2D40" font-weight="400">Tất cả thay đổi đã được lưu. Hệ thống ghi nhận thời điểm hoàn thành trên revision</text><text x="445" y="461" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#1B2D40" font-weight="400">hiện tại.</text><text x="445" y="532" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" fill="#1B2D40" font-weight="400">Anh/chị vẫn có thể sửa trước hạn. Khi sửa dữ liệu, trạng thái trở về Đang nhập và</text><text x="445" y="555" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" fill="#1B2D40" font-weight="400">cần xác nhận hoàn thành lại.</text><rect x="870" y="660" width="120" height="38" rx="6" fill="white" stroke="#D8E2EC"/><text x="884" y="685" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#1B2D40" font-weight="700">Quay lại</text><rect x="1007" y="660" width="189" height="38" rx="6" fill="#1468B3" stroke="#1468B3"/><text x="1021" y="685" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="white" font-weight="700">Hoàn thành</text><rect x="244" y="813" width="1168" height="48" rx="6" fill="#E8F5EF"/><text x="260" y="843" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#127453" font-weight="700">Sau thành công: badge Hoàn thành, thời điểm xác nhận và revision hiển thị ngay trên form.</text></svg>