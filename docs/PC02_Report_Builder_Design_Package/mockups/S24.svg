<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960"><title>S24 Responsive và editor từng ô</title><rect x="0" y="0" width="1440" height="960" rx="0" fill="#F3F6FA"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="white"/><rect x="0" y="64" width="216" height="896" rx="0" fill="#083C70"/><rect x="20" y="15" width="34" height="34" rx="6" fill="#B68A1F"/><text x="27" y="39" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="white" font-weight="700">PC</text><text x="68" y="30" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#083C70" font-weight="700">HỆ THỐNG PC02</text><text x="68" y="48" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" fill="#63758A" font-weight="400">Quản lý báo cáo</text><text x="1150" y="28" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#1B2D40" font-weight="700">Tài khoản minh họa</text><text x="1150" y="48" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" fill="#63758A" font-weight="400">Báo cáo động</text><text x="22" y="108" font-family="Arial,DejaVu Sans,sans-serif" font-size="11" fill="#ABC6DF" font-weight="400">TÌM KIẾM MENU</text><text x="22" y="157" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="white" font-weight="400">Tổng quan</text><text x="22" y="202" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="white" font-weight="400">Nghiệp vụ chính</text><text x="22" y="264" font-family="Arial,DejaVu Sans,sans-serif" font-size="11" fill="#F4CF76" font-weight="700">BÁO CÁO VÀ THỐNG KÊ</text><text x="24" y="315" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="white" font-weight="400">Thiết lập báo cáo</text><rect x="10" y="339" width="196" height="43" rx="6" fill="#155C98"/><text x="24" y="367" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="white" font-weight="700">Nhập và tổng hợp</text><text x="24" y="419" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="white" font-weight="400">Tình trạng nhập liệu</text><text x="24" y="487" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#C8DBEA" font-weight="400">Báo cáo tháng</text><text x="24" y="532" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#C8DBEA" font-weight="400">Báo cáo quý</text><text x="24" y="577" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#C8DBEA" font-weight="400">Hệ thống</text><text x="24" y="622" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#C8DBEA" font-weight="400">Quản trị</text><text x="20" y="917" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" fill="#C8DBEA" font-weight="400">Mockup đề xuất v1.0</text><text x="20" y="940" font-family="Arial,DejaVu Sans,sans-serif" font-size="11" fill="#C8DBEA" font-weight="400">Dữ liệu minh họa</text><text x="244" y="96" font-family="Arial,DejaVu Sans,sans-serif" font-size="11" fill="#63758A" font-weight="700">BÁO CÁO ĐỘNG  /  S24</text><text x="244" y="139" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#1B2D40" font-weight="700">Nhập liệu trên màn hình hẹp</text><text x="244" y="166" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#63758A" font-weight="400">Giữ bảng Excel cuộn ngang; mở editor riêng cho ô đang chọn.</text><rect x="276" y="218" width="400" height="678" rx="30" fill="#14273A"/><rect x="291" y="241" width="370" height="629" rx="18" fill="white"/><text x="312" y="285" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#1B2D40" font-weight="700">Báo cáo hoạt động tuần</text><text x="312" y="316" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#1468B3" font-weight="400">Tuần 41 · Còn 2 giờ</text><rect x="308" y="343" width="335" height="185" rx="8" fill="#F3F6FA" stroke="#D8E2EC"/><text x="322" y="378" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#1B2D40" font-weight="700">Chỉ tiêu</text><text x="500" y="378" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#1B2D40" font-weight="700">Giá trị</text><text x="322" y="426" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#1B2D40" font-weight="400">Tiếp nhận mới</text><text x="519" y="426" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="#1468B3" font-weight="700">125</text><text x="322" y="475" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#1B2D40" font-weight="400">Đã xử lý</text><text x="519" y="475" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="#1B2D40" font-weight="400">96</text><text x="319" y="552" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" fill="#63758A" font-weight="400">Vuốt ngang để xem đủ các cột</text><text x="312" y="599" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#63758A" font-weight="700">Ô A2 · Tổng tiếp nhận</text><rect x="312" y="611" width="326" height="44" rx="6" fill="white" stroke="#D8E2EC"/><text x="324" y="639" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="#1B2D40" font-weight="400">125</text><rect x="312" y="707" width="326" height="38" rx="6" fill="#1468B3" stroke="#1468B3"/><text x="326" y="732" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="white" font-weight="700">Lưu giá trị</text><text x="312" y="785" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#127453" font-weight="400">Đã lưu lúc 14:45</text><text x="735" y="287" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" fill="#1B2D40" font-weight="700">Tương tác thích ứng</text><text x="735" y="338" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#1B2D40" font-weight="400">Desktop và tablet là môi trường nhập chính. Trên điện thoại, không</text><text x="735" y="362" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#1B2D40" font-weight="400">thu nhỏ toàn bộ sheet tới mức khó đọc.</text><text x="735" y="441" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#1B2D40" font-weight="400">Chạm ô nhập để mở editor đúng kiểu dữ liệu. Date và time dùng</text><text x="735" y="465" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#1B2D40" font-weight="400">picker. Header giữ tên báo cáo, kỳ và trạng thái hạn.</text><text x="735" y="547" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#1B2D40" font-weight="400">Thanh lưu không che bàn phím. Ô tĩnh và công thức không mở editor.</text><text x="735" y="571" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#1B2D40" font-weight="400">Cần kiểm thử keyboard, focus và trình đọc màn hình.</text></svg>