th="282" height="50" rx="8" fill="white" stroke="#D8E2EC"/><text x="1146" y="226" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#63758A" font-weight="700">4. Phân công và xác nhận</text><rect x="244" y="268" width="1168" height="48" rx="6" fill="#FCECEE"/><text x="260" y="298" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#B32E36" font-weight="700">Có 3 lỗi cần sửa và 1 cảnh báo. Dữ liệu mẫu chưa được phát hành.</text><rect x="260" y="347" width="1130" height="42" rx="0" fill="#EAF0F6"/><text x="272" y="374" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#63758A" font-weight="700">Mức độ</text><text x="411.5061728395061" y="374" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#63758A" font-weight="700">Vị trí</text><text x="648.6666666666665" y="374" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#63758A" font-weight="700">Nội dung</text><text x="1025.333333333333" y="374" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#63758A" font-weight="700">Cách xử lý</text><rect x="260" y="389" width="1130" height="75" rx="0" fill="white" stroke="#D8E2EC"/><text x="272" y="411" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#1B2D40" font-weight="400">Lỗi</text><text x="411.5061728395061" y="411" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#1B2D40" font-weight="400">Tổng hợp!A2</text><text x="648.6666666666665" y="411" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#1B2D40" font-weight="400">Token nằm trong ô Locked</text><text x="1025.333333333333" y="411" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#1B2D40" font-weight="400">Mở khóa ô A2 trong Excel</text><rect x="260" y="464" width="1130" height="75" rx="0" fill="#F8FAFC" stroke="#D8E2EC"/><text x="272" y="486" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#1B2D40" font-weight="400">Lỗi</text><text x="411.5061728395061" y="486" font-