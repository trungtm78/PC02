name: Shell Parity Gate

# Blocks PRs that modify *ListPageShell.tsx files without updating
# docs/audit/shell-parity-matrix.md. Process fix from /autoplan CEO+Eng
# dual-voice review (v0.63 plan v2).
#
# Bypass: include "[parity-skip]" in the PR title (case-insensitive) for
# refactor-only or comment-only changes that don't affect feature parity.

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/src/pages/**/ListPageShell.tsx"
      - "frontend/src/pages/**/*ListPageShell.tsx"
      - "docs/audit/shell-parity-matrix.md"

jobs:
  parity-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check parity matrix sync
        # Tiêu đề PR đi qua BIẾN MÔI TRƯỜNG, không nội suy thẳng vào thân script.
        #
        # `${{ github.event.pull_request.title }}` được thay vào văn bản script TRƯỚC khi shell
        # đọc, nên một tiêu đề chứa dấu nháy, `$`, backtick hay dấu gạch chéo là chạy lệnh
        # ngoài ý muốn — và tiêu đề do người gửi PR tự đặt. Đây là lỗ hổng chèn mã của GitHub
        # Actions, không phải chuyện thẩm mỹ.
        #
        # Vỡ thật ngày 27/08/2026 với tiêu đề chứa "Nguồn đơn/Đơn vị giao": job chết ở
        # `line 2: đơn/Đơn: No such file or directory`.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if echo "$PR_TITLE" | grep -iE '\[parity-skip\]' >/dev/null; then
            echo "::notice::Parity check skipped via [parity-skip] in PR title."
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Comparing $BASE_SHA..$HEAD_SHA"

          SHELL_CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep -E 'frontend/src/pages/.*ListPageShell\.tsx$' || true)

          if [ -z "$SHELL_CHANGED" ]; then
            echo "No shell files changed. Pass."
            exit 0
          fi

          echo "Shell files changed:"
          echo "$SHELL_CHANGED"

          MATRIX_CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep -F 'docs/audit/shell-parity-matrix.md' || true)

          if [ -z "$MATRIX_CHANGED" ]; then
            echo "::error::Shell file(s) changed but docs/audit/shell-parity-matrix.md NOT updated."
            echo "::error::Either update the matrix to reflect added/removed features,"
            echo "::error::or add [parity-skip] to the PR title for refactor-only changes."
            exit 1
          fi

          echo "Both shell and parity matrix updated. Pass."
