name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Enforces the rules the project documents but nothing checked. Ordered so
  # the two dependency-free guards fail fast, before spending time on npm ci.
  governance:
    name: Governance Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The lint ratchet diffs against the merge base with main.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # CLAUDE.md has always claimed CI verified this. It did not, until now.
      - name: Enum literals are not compared as strings
        run: node scripts/governance/check-enum-literals.cjs

      # generated.ts is committed, so a schema change without re-running the
      # generator ships a frontend that disagrees with the database.
      - name: Shared enums are in sync with schema.prisma
        run: |
          cd backend && npm run gen:enums
          cd "$GITHUB_WORKSPACE"
          git diff --exit-code -- frontend/src/shared/enums/ \
            || { echo "::error::gen:enums produced changes — run 'cd backend && npm run gen:enums' and commit the result."; exit 1; }

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # Whole-repo lint is ~9.3k problems of accumulated debt, so the gate is
      # monotonic instead: a file this branch touches may not get worse.
      - name: Lint ratchet on changed files
        run: node scripts/governance/lint-changed.cjs origin/main

  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Generate Prisma client
        run: cd backend && npx prisma generate

      - name: Run tests
        run: cd backend && npm test

      - name: TypeScript type check
        run: cd backend && npx tsc --noEmit

      - name: Admin-units seed dry-run smoke
        run: cd backend && npx ts-node prisma/seed-admin-units-runner.ts --dry-run

  frontend-test:
    name: Frontend Tests (P2-003 fix)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run vitest
        run: cd frontend && npx vitest run --no-coverage

      - name: TypeScript type check
        # FE tsconfig là solution-file → `tsc --noEmit` là NO-OP (luôn pass). Phải `tsc -b` mới type-check thật.
        run: cd frontend && npx tsc -b
