name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Generate Prisma client
        run: cd backend && npx prisma generate

      - name: Run tests
        run: cd backend && npm test

      - name: TypeScript type check
        run: cd backend && npx tsc --noEmit

      - name: Admin-units seed dry-run smoke
        run: cd backend && npx ts-node prisma/seed-admin-units-runner.ts --dry-run

  frontend-test:
    name: Frontend Tests (P2-003 fix)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run vitest
        run: cd frontend && npx vitest run --no-coverage

      - name: TypeScript type check
        # FE tsconfig là solution-file → `tsc --noEmit` là NO-OP (luôn pass). Phải `tsc -b` mới type-check thật.
        run: cd frontend && npx tsc -b

  engine-gate:
    name: Engine Gate (Chromium + WebKit)
    runs-on: ubuntu-latest

    # VI SAO CAN JOB RIENG: `<input type="date">` xu ly gia tri KHONG hop le khac nhau giua cac
    # engine — do 23/09/2026, `value="undefined"` cho "" tren Chromium nhung GIU NGUYEN
    # "undefined" tren WebKit (engine Safari). Chuoi rac song sot tren may macOS roi di len may
    # chu luc bam Luu. jsdom hanh xu Y HET Chromium, nen ~3.960 ca vitest deu MU voi lop loi ay.
    # Day la job DUY NHAT trong kho cham duoc toi hanh vi do.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install Playwright + browsers
        # Bước này đã TREO 17–20 phút trên runner hai lần (08–09/10/2026, lỗi hạ tầng tải trình duyệt). Giới hạn thời gian để
        # treo thì THẤT BẠI nhanh và chạy lại được, thay vì chiếm hàng đợi 20 phút rồi mới bị huỷ tay.
        timeout-minutes: 10
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit

      - name: Run engine gate
        run: npx playwright test --config=playwright.engine.config.ts

  monkey-self-test:
    name: Monkey Self-Test (chung am)
    runs-on: ubuntu-latest

    # VI SAO CAN JOB RIENG: bo monkey test chi co gia tri neu no DO DUOC. Ca chung am dung mot trang mau co 3 loi gieo san
    # (pageerror, URL doi khi boi chu, o chi-xem go duoc) va bat bo chay phai bao du ca ba; cung thao tac tren trang SACH phai
    # ra 0 phat hien. Job nay cung chung minh bo chay CHAY DUOC tu kho moi clone (playwright cai trong tools/monkey-test,
    # khong muon cua thu muc khac) - mot cong khong chay con te hon khong co cong.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install monkey-test + Chromium
        run: |
          cd tools/monkey-test
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run negative-control self-test
        run: cd tools/monkey-test && npm test

  database-gate:
    name: Database Gate (PostgreSQL)
    runs-on: ubuntu-latest

    # VI SAO CAN JOB RIENG: cac spec don vi cua backend gia lap Prisma, nen chi chung minh HINH DANG truy van. Hai dieu
    # quan trong nhat cua goi y ten nguoi gui kem noi dung to giac chi lo ra tren CSDL THAT: (1) `groupBy` voi
    # `orderBy: _count` + `take` that su chay duoc tren PostgreSQL; (2) pham vi du lieu co lap that su (cung mot ten o hai
    # to, don xoa mem, don chua gan to, can bo phuong, pham vi rong). Codex review 08/10/2026 chi ra spec CSDL that bi
    # BO QUA o CI vi khong co bien dia chi.
    #
    # `PETITION_SUGGEST_DATABASE_REQUIRED=1`: thieu dia chi CSDL la LOI, khong phai "bo qua". Khong co no thi job mat dich
    # vu PostgreSQL van bao xanh (ca bo bi skip) — cong khong chay con te hon khong co cong.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pc02_goiy_scope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pc02_goiy_scope_test
      PETITION_SUGGEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pc02_goiy_scope_test
      PETITION_SUGGEST_DATABASE_REQUIRED: '1'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Generate Prisma client
        run: cd backend && npx prisma generate

      - name: Create schema in the scratch database
        run: cd backend && npx prisma db push --accept-data-loss

      - name: Run database-backed specs
        run: cd backend && npx jest src/petitions/goi-y-don-theo-ten.database.spec.ts --no-coverage --ci
