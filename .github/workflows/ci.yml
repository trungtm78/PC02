name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Enforces the rules the project documents but nothing checked. Ordered so
  # the two dependency-free guards fail fast, before spending time on npm ci.
  governance:
    name: Governance Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The lint ratchet diffs against the merge base with main.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # CLAUDE.md has always claimed CI verified this. It did not, until now.
      - name: Enum literals are not compared as strings
        run: node scripts/governance/check-enum-literals.cjs

      # generated.ts is committed, so a schema change without re-running the
      # generator ships a frontend that disagrees with the database.
      - name: Shared enums are in sync with schema.prisma
        run: |
          cd backend && npm run gen:enums
          cd "$GITHUB_WORKSPACE"
          git diff --exit-code -- frontend/src/shared/enums/ \
            || { echo "::error::gen:enums produced changes — run 'cd backend && npm run gen:enums' and commit the result."; exit 1; }

      # Same contract as the enums above: the generated registry is committed,
      # so a new feature.manifest.ts without a regenerate ships a backend that
      # has never heard of a module the frontend already shows a menu item for.
      # That failure mode has reached production three times.
      - name: Feature registry is in sync with the manifests on disk
        run: |
          cd backend && npm run gen:feature-registry
          cd "$GITHUB_WORKSPACE"
          git diff --exit-code -- backend/src/feature-flags/feature-registry.generated.ts \
            || { echo "::error::A feature.manifest.ts was added or renamed — run 'cd backend && npm run gen:feature-registry' and commit the result."; exit 1; }

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # Whole-repo lint is ~11.5k problems of accumulated debt, so the gate is
      # monotonic instead: a file this branch touches may not get worse.
      - name: Lint ratchet on changed files
        run: node scripts/governance/lint-changed.cjs origin/main

  # Reports only, for now. Both checks are known to be red against the current
  # tree, and turning them into merge blockers before that is dealt with would
  # stop every PR on debt unrelated to it:
  #
  #  - tests/ type-check: 9 errors across 6 generated UAT specs that CI does
  #    not run — see ND-10 in PROGRESS.md. The live parts are already clean.
  #  - schema drift: production carries at least six partial indexes that
  #    Prisma 7 has no syntax for (20260516120000, 20260522131024,
  #    20260627130700), so `migrate diff` reports a difference that cannot be
  #    expressed in schema.prisma. Upcoming work adds another one.
  #
  # Flip continue-on-error off per check, as each becomes actionable.
  # e2e-new CHƯA vào CI — và lý do đã đổi, đừng đọc theo bản cũ.
  #
  # Comment trước ghi "has no specs ... joins CI with its first spec". Điều kiện
  # đó đã đạt: nay có 5 spec / 34 kiểm, tất cả xanh khi chạy tay
  # (`UAT-COVERAGE.md`). Cái chặn bây giờ là HẠ TẦNG, không phải thiếu spec:
  #
  #   1. Chúng gọi API thật, nên cần backend chạy + Postgres + `migrate deploy`
  #      + seed (`seed.ts`, `seed-permissions.ts`, `seed-feature-flags.ts`,
  #      `seed-document-templates.ts`). Thiếu seed cuối thì tạo đơn thư trả 503.
  #   2. `tests/global-setup.ts` đòi ADMIN_USERNAME/ADMIN_PASSWORD từ môi trường
  #      — cố ý, không có default (mật khẩu mặc định là mật khẩu bị commit).
  #      CI cần một cặp secret cho tài khoản dùng riêng cho test.
  #   3. Bộ Đợt 4 còn cần frontend chạy; ba bộ kia chỉ cần backend.
  #   4. Bộ gate cờ BẬT/TẮT feature flag thật rồi bật lại. An toàn trên DB dùng
  #      riêng cho một lần chạy; KHÔNG được trỏ vào DB dùng chung.
  #
  # Việc cần làm để nối: một job riêng có `services: postgres`, boot backend,
  # seed, rồi `npx playwright test --project=e2e-new`. Chạy tách khỏi job
  # `test` để một lỗi hạ tầng CI không che mất kết quả unit test.
  advisory:
    name: Advisory Checks (non-blocking)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pc02_ci
          POSTGRES_PASSWORD: pc02_ci
          POSTGRES_DB: pc02_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pc02_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Install root dependencies
        run: npm ci

      # tests/ has never been type-checked. 9 errors remain, all in generated
      # UAT specs that CI does not run (missing variables the generator forgot
      # to declare, a duplicated object key, an absent jszip dependency) — see
      # tests/e2e-new/README.md for why that suite is not wired up. The live
      # parts (global-setup, pages, helpers, e2e-new) are clean.
      - name: Type-check tests/
        continue-on-error: true
        run: |
          node backend/node_modules/typescript/bin/tsc --noEmit -p tsconfig.json \
          && echo "tests/ type-checks clean." \
          || echo "::warning::tests/ has type errors — expected while the generated UAT specs are unfixed."

      # Compares the applied migration history against schema.prisma using a
      # shadow database, catching a schema edited without a migration.
      - name: Migration drift
        continue-on-error: true
        env:
          SHADOW_DATABASE_URL: postgresql://pc02_ci:pc02_ci@localhost:5432/pc02_ci?schema=shadow
        run: |
          cd backend
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code \
          && echo "No drift." \
          || echo "::warning::Schema drift detected — expected while the partial-index gap is open."

  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Generate Prisma client
        run: cd backend && npx prisma generate

      - name: Run tests
        run: cd backend && npm test

      - name: TypeScript type check
        run: cd backend && npx tsc --noEmit

      - name: Admin-units seed dry-run smoke
        run: cd backend && npx ts-node prisma/seed-admin-units-runner.ts --dry-run

  frontend-test:
    name: Frontend Tests (P2-003 fix)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run vitest
        run: cd frontend && npx vitest run --no-coverage

      - name: TypeScript type check
        # FE tsconfig là solution-file → `tsc --noEmit` là NO-OP (luôn pass). Phải `tsc -b` mới type-check thật.
        run: cd frontend && npx tsc -b
